name: syncboard_mobile
description: "SyncBoard Android WSS Client for local-network peer-to-peer transfer"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Network, WebSockets & Cryptography
  web_socket_channel: ^3.0.0
  crypto: ^3.0.3
  uuid: ^4.4.0

  # Storage, Keystore & Preferences
  sqflite: ^2.3.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Hardware, Files & Sharing
  mobile_scanner: ^5.1.1
  file_picker: ^8.0.7
  path_provider: ^2.1.3
  path: ^1.9.0
  open_filex: ^4.4.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^6.1.1
  receive_sharing_intent: ^1.4.8

  # Formatting & UI Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
